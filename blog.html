<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Blog — Irem Nur Yıldırım</title>
    <meta name="author" content="Irem Nur Yıldırım">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
  </head>

  <body>
    <div class="container">

      <nav>
        <a class="brand" href="index.html">Irem Nur Yıldırım</a>
        <div class="navlinks">
          <a href="index.html">Home</a>
          <a href="index.html#papers">Papers</a>
          <a href="blog.html" class="active">Blog</a>
        </div>
      </nav>

      <div class="page">

        <div class="subtabs">
          <button class="subtab active" data-panel="notes">Notes</button>
          <button class="subtab" data-panel="thoughts">Thoughts</button>
        </div>

        <div class="panel" data-panel="notes">

          <a class="post" href="posts/welcome.html">
            <span class="post-meta">Irem Nur Yıldırım</span>
            <span class="post-title">Welcome</span>
          </a>

        </div>

        <div class="panel" data-panel="thoughts" hidden></div>

      </div>

    </div>

    <script>
      document.querySelectorAll('.subtab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var target = btn.dataset.panel;
          document.querySelectorAll('.subtab').forEach(function (b) {
            b.classList.toggle('active', b === btn);
          });
          document.querySelectorAll('.panel').forEach(function (panel) {
            var show = panel.dataset.panel === target;
            panel.hidden = !show;
          });
        });
      });
    </script>
  </body>
</html>
