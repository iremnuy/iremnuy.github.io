remote_theme: daattali/beautiful-jekyll@6.0.1

title: Irem Nur Yıldırım
author: Irem Nur Yıldırım

navbar-links:
  About Me: "aboutme"
  Posts: "posts"

avatar: "/assets/img/avatar-icon.png"
round-avatar: true

social-network-links:
  rss: true
  github: iremnuy

rss-description: Personal site and blog

url: "https://iremnuy.github.io"
baseurl: ""

share-links-active:
  twitter: true
  facebook: true
  linkedin: true

url-pretty: "iremnuy.github.io"
title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: true

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

date_format: "%B %-d, %Y"

timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
